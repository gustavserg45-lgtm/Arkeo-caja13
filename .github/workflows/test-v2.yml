name: Probar Arqueo Express v2
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'cashier-v2.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/test-v2.yml'
      - 'arqueo de caja/**'
      - 'rediseno/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar JavaScript
        run: |
          node --check "arqueo de caja/app.js"
          node --check "arqueo de caja/cashier-v2.js"
          node --check "arqueo de caja/tests/v2-smoke.cjs"
          node --check "arqueo de caja/tests/static-contract.cjs"
          node --check "rediseno/core.js"
          node --check "rediseno/ui.js"
          node --check "rediseno/flows.js"
          node --check "rediseno/flows2.js"
          node --check "rediseno/main.js"
      - name: Instalar DOM de pruebas
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Ejecutar flujo real simulado
        working-directory: arqueo de caja
        run: node tests/v2-smoke.cjs
      - name: Verificar contrato estático
        working-directory: arqueo de caja
        run: node tests/static-contract.cjs

name: Publicar Arqueo Express en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estatico
        run: |
          mkdir -p _site
          cp "arqueo de caja/index.html" "arqueo de caja/app.js" "arqueo de caja/reconciliation.js" "arqueo de caja/styles.css" "arqueo de caja/cashier.css" "arqueo de caja/cashier-v2.js" "arqueo de caja/cashier-v2.css" "arqueo de caja/sw.js" "arqueo de caja/icon.svg" "arqueo de caja/manifest.webmanifest" "arqueo de caja/.nojekyll" _site/
      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
